# Builds and tests the KMRP Save Editor on Windows, Linux and macOS.
#
# The runners have no KotOR install and none of the game's font atlases, so the tests
# that read real saves find none and pass empty, and the window is built with the
# system's font instead of KMRP's (build.rs prints a warning). Release builds are made
# where the fonts exist; this checks that the editor compiles and its unit tests pass
# everywhere.
name: Save Editor

on:
  push:
    branches: [master]
    paths: ["save-editor/**", ".github/workflows/save-editor.yml"]
  pull_request:
    paths: ["save-editor/**", ".github/workflows/save-editor.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: save-editor
    steps:
      - uses: actions/checkout@v7
      - name: Linux window libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libfontconfig1-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev
      - name: Test
        run: cargo test --release
      - name: Build
        run: cargo build --release
      - uses: actions/upload-artifact@v7
        with:
          name: kmrp-save-editor-${{ runner.os }}
          path: |
            save-editor/build/target/release/kmrp-save-editor
            save-editor/build/target/release/kmrp-save-editor.exe
          if-no-files-found: ignore

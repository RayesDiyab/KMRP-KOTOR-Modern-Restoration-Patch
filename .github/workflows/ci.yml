# Deliberately small.
#
# A full installer build still needs the game's own texture pack, which cannot
# be committed. Since 2026-10-01 engine assembly needs no clean EXE or gold
# snapshot; Test-WindowsEngineSource.py verifies that source-only path separately.
# This workflow byte-compiles Python tools and checks relative documentation links.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python tools compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Byte-compiles every tool: catches syntax errors without needing pykotor,
      # Pillow, numpy or any game file.
      - name: Byte-compile tools/
        run: python -m compileall -q tools

  links:
    name: Documentation links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check relative Markdown links resolve
        run: python .github/scripts/check_links.py

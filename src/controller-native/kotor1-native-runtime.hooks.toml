# The standalone module's own sites, measured on CD/GOG/Steam K1. Its other hooks
# are the core, movie and memory hooks of kotor1.hooks.toml, selected by
# tools/build_native_kpatch.py; that table is unchanged.
# Stack arguments are "esp+N": KPM 0.7.1 passes the ADDRESS of that slot, and its
# released runtime drops a bracketed "[esp+N]" source without pushing anything.
[metadata]
target_versions = ["761F9466F456A83909036BAEBB5C43167D722387BE66E54617BA20A8C49E9886", "9C10E0450A6EECA417E036E3CDE7474FED1F0A92AAB018446D156944DEA91435", "34E6D971C034222A417995D8E1E8FDD9F8781795C9C289BD86C499A439F34C88"]

# IsValidResolution: CMP EAX,800. Callback supplies the result in EAX.
# Valid dimensions leave through the original RET 8. For rejection EAX=0:
# replayed CMP takes JNE through each native width check, ending in XOR EAX,EAX.
[[hooks]]
address = 0x005F0C64
type = "detour"
function = "KmrpAllowRuntimeResolutionK1"
original_bytes = [0x3D, 0x20, 0x03, 0x00, 0x00]
exclude_from_restore = ["eax"]
consumed_exit_address = 0x005F0CD2

[[hooks.parameters]]
source = "esp+4"
type = "pointer"
[[hooks.parameters]]
source = "esp+8"
type = "pointer"

# SetSize entry: request only; native SetSize and panel/texture handling still run.
[[hooks]]
address = 0x0040BE70
type = "detour"
function = "KmrpResolutionRequestedK1"
original_bytes = [0x8B, 0x44, 0x24, 0x04, 0x56]
[[hooks.parameters]]
source = "ecx"
type = "pointer"

[[hooks.parameters]]
source = "esp+4"
type = "pointer"
[[hooks.parameters]]
source = "esp+8"
type = "pointer"

# The native mode switch, after it stores the new size (0x0078D1D4/0x0078D1D8) and
# before it re-creates the window at 0x005F19B2, which reloads every texture:
# `cmp dword ptr [0x7A3A2C], 1`, absolute, one whole instruction. It is a branch
# target only at its first byte. KPM replays it after the callback, so the JNE at
# 0x005F1909 reads the flags it always did.
[[hooks]]
address = 0x005F18F6
type = "detour"
function = "KmrpModeSwitchK1"
original_bytes = [0x83, 0x3D, 0x2C, 0x3A, 0x7A, 0x00, 0x01]

# The GUI frame (0x0040CE70) is the core table's CoreGuiFrameK1 site, defined for
# this module in K1RuntimeCore.cpp: it samples the actual viewport first, so a
# rejected request is never mistaken for a switch.

# ToolTipPanel constructor: width 1280 with height other than 960/1024
# skipped StartLoadFromLayout entirely. Route its existing JNE to the same
# tooltip6X4 fallback already used for other non-vanilla widths.
[[hooks]]
address = 0x0062785F
type = "simple"
original_bytes = [0x75, 0x59]
replacement_bytes = [0x75, 0x3F]

# Prepare the embedded bank before the first native resource lookup, so font
# images and TXI coordinates cannot mix cached stock and replacement data.
[[hooks]]
address = 0x00407230
type = "detour"
function = "KmrpPrepareResourcesK1"
original_bytes = [0x8B, 0x44, 0x24, 0x04, 0x53]
[[hooks.parameters]]
source = "ecx"
type = "pointer"

[[hooks]]
address = 0x40a680
type = "detour"
function = "KmrpPanelLayoutStartK1"
original_bytes = [0x64, 0xa1, 0x0, 0x0, 0x0, 0x0]
[[hooks.parameters]]
source = "ecx"
type = "pointer"
[[hooks.parameters]]
source = "esp+4"
type = "pointer"

[[hooks]]
address = 0x40b930
type = "detour"
function = "KmrpPanelControlK1"
original_bytes = [0x8b, 0x44, 0x24, 0x8, 0x55]
[[hooks.parameters]]
source = "ecx"
type = "pointer"
[[hooks.parameters]]
source = "esp+4"
type = "pointer"
[[hooks.parameters]]
source = "esp+8"
type = "pointer"
[[hooks.parameters]]
source = "esp+12"
type = "pointer"

[[hooks]]
address = 0x40cf70
type = "detour"
function = "KmrpPanelDestroyedK1"
original_bytes = [0x6a, 0xff, 0x68, 0x83, 0x48, 0x71, 0x0]
[[hooks.parameters]]
source = "ecx"
type = "pointer"

[[hooks]]
address = 0x419a20
type = "detour"
function = "KmrpControlDestroyedK1"
original_bytes = [0x6a, 0xff, 0x68, 0xae, 0x51, 0x71, 0x0]
[[hooks.parameters]]
source = "ecx"
type = "pointer"

# CSWGuiListBox::OrganizeControls (0x41b140), the three places it hands a row its
# rectangle, which is on the stack at [esp+0x20]: the rows above the first shown, the
# rows shown, the rows below. Each is "lea reg, [esp+0x20] / push reg", five bytes with
# nothing to relocate, before the call to the row's SetExtent; none is a branch target
# and none is among the bytes KMRP's own changes to this routine rewrite
# (reverse-engineering/listbox-geometry.md). ESI the list, ECX the row.
# K1RuntimeLayout.cpp, "List rows".
[[hooks]]
address = 0x41b4bf
type = "detour"
function = "KmrpListRowK1"
original_bytes = [0x8d, 0x54, 0x24, 0x20, 0x52]
[[hooks.parameters]]
source = "esi"
type = "pointer"
[[hooks.parameters]]
source = "ecx"
type = "pointer"
[[hooks.parameters]]
source = "esp+32"
type = "pointer"

[[hooks]]
address = 0x41b540
type = "detour"
function = "KmrpListRowK1"
original_bytes = [0x8d, 0x44, 0x24, 0x20, 0x50]
[[hooks.parameters]]
source = "esi"
type = "pointer"
[[hooks.parameters]]
source = "ecx"
type = "pointer"
[[hooks.parameters]]
source = "esp+32"
type = "pointer"

[[hooks]]
address = 0x41b59f
type = "detour"
function = "KmrpListRowK1"
original_bytes = [0x8d, 0x44, 0x24, 0x20, 0x50]
[[hooks.parameters]]
source = "esi"
type = "pointer"
[[hooks.parameters]]
source = "ecx"
type = "pointer"
[[hooks.parameters]]
source = "esp+32"
type = "pointer"

# CSWGuiListBox::AddControls, entry (K1RuntimeLayout.cpp, KmrpListAddRowsK1): the rows
# that outlive a change of resolution get the row height of the size in force before
# the list reads it. ECX the list, the first argument the rows. The two instructions
# are sub esp, 8 and mov eax, [esp+0xC]; nothing to relocate, not a branch's target
# (the routine's entry). Brought over from the Mac on 2026-10-09.
[[hooks]]
address = 0x41c1d0
type = "detour"
function = "KmrpListAddRowsK1"
original_bytes = [0x83, 0xec, 0x08, 0x8b, 0x44, 0x24, 0x0c]
[[hooks.parameters]]
source = "ecx"
type = "pointer"
[[hooks.parameters]]
source = "esp+4"
type = "pointer"

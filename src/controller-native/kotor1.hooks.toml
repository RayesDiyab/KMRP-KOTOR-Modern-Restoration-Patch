# `install` says which install a hook belongs to (KMRP's own key; KPM ignores it):
#
#   "always"         the core runtime -- installed with or without the controller
#                    option: memory safety, movie bars, mouse confinement, the
#                    status summary's layout
#   "controller"     only with controller support (the default when absent)
#   "no-controller"  only without it: a core stand-in for a controller hook at
#                    the same address, doing just that hook's non-controller part
#
# Since 2026-09-28 the controller option switches only the controller's own
# hooks; until then turning it off removed the core hooks with it.
# tools/kmrp_controller.py derives both installed sets from this key, and
# src/patcher/KmrpPatcher.cs (BuildConfig) must emit exactly those sets.
#
# `kpm_provided_by` names the KOTOR Patch Manager patch that also makes a hook's
# change (KMRP adopted it from there). Both editions carry such hooks. The KPM
# edition's KMRP patch declares a conflict with that patch instead, since two
# patches at one address is an install error in KPM (tools/build_kpatch.py).
# Until later on 2026-09-28 it left these hooks out and required the KPM patches,
# but Texture Bucket Safety and Grass Memory Safety do not support Steam's
# swkotor.exe.
#
# `kpm_patch` says which of the KPM edition's patches carries a hook: by default
# "kmrp" for `always` and `no-controller` hooks and "kmrp-controller" for
# `controller` ones. An empty value means none: the controller's GUI and movie
# frames share their sites with the core's stand-ins, and KPM allows one patch per
# address, so in the KPM edition the core's stand-in holds the site and calls the
# controller's frame when KMRP Controller is installed (K1NativeJoystick.cpp).
# "kmrp-movies" marks the movie window's hooks, which belong to KMRP Movies.

# Keyboard navigation is core behavior, independent of the controller option.
# CSWGuiNavigable::HandleInputEvent: mov eax,[esp+8] / test eax,eax.
# Handled events become the unused 0x41; the original entry remains intact.
[[hooks]]
address = 0x0041A9D0
type = "detour"
install = "always"
function = "KeyboardNavigateK1"
original_bytes = [0x8B, 0x44, 0x24, 0x08, 0x85, 0xC0]
skip_original_bytes = false
exclude_from_restore = []


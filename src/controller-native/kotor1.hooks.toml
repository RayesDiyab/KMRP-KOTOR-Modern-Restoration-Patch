    0x8B, 0x56, 0x3C, 0x52, 0xE8, 0x0B, 0x1F, 0x25,
    0x00
]
replacement_bytes = [
    0x8B, 0x56, 0x3C, 0x3B, 0x56, 0x38, 0x75, 0x02,
    0x33, 0xD2, 0x52, 0xB8, 0x90, 0xA3, 0x6F, 0x00,
    0xFF, 0xD0
]

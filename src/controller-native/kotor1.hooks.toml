# UpdateRumble's frame-time argument, a float in seconds, which drives the
# mixer's clock (K1Rumble.cpp). At this site ESP is the entry ESP less 0x14 --
# `sub esp,0x10` and `push ebp`; every bail path and the loop's own pushes and
# pops meet here level -- so the argument at entry [esp+4] is [esp+0x18]. The
# loop reads the same slot as [esp+0x24] under its three extra pushes
# (0x005F7599). Written in decimal: KPM parses the offset with std::stoi
# (wrapper_x86.cpp), which reads "0x18" as 0.
[[hooks.parameters]]

# ---------------------------------------------------------------------------
# Native joystick path. Feeds XInput into KOTOR's own retained joystick
# pipeline instead of synthesising keystrokes. See
# reverse-engineering/retained-xbox-gui-events.md for the measurements behind
# every address here.
# ---------------------------------------------------------------------------

# Register the joystick descriptions and raise the device count, once the input
# singleton exists. Idempotent; runs every frame and returns immediately after
# the first success.
[[hooks]]
address = 0x005E24E0
type = "detour"
function = "NativeJoystickInitK1"
original_bytes = [0x6A, 0xFF, 0x68, 0xFD, 0x48, 0x72, 0x00]
skip_original_bytes = false
exclude_from_restore = []

[[hooks.parameters]]
source = "ecx"
type = "pointer"

# Replace CExoRawInputInternal::GetJoystickBuffer. Hooked past the entry, where
# esi holds the caller's record buffer -- at the true entry it is still only on
# the stack, and hook parameters come from registers. ebx, esi and edi are all
# pushed by this point, so the consumed exit unwinds correctly, and GetEvents
# ignores this function's return value.
[[hooks]]
address = 0x005E30F6
type = "detour"
function = "NativeJoystickBufferK1"
original_bytes = [0x89, 0x5C, 0x24, 0x2C, 0x74, 0x0F]
skip_original_bytes = true
consumed_exit_address = 0x005E319B
exclude_from_restore = ["eax"]

[[hooks.parameters]]
source = "esi"
type = "pointer"

# Override the movement axes at the single point every control scheme passes
# through. ProcessInput has already clamped the keyboard values into +0x10 and
# +0x14 by here, so the stick only displaces them when it is outside the
# deadzone -- keyboard movement is untouched otherwise.
[[hooks]]
address = 0x00679940
type = "detour"
function = "NativeJoystickMovementK1"
original_bytes = [0xD9, 0x05, 0x64, 0xD7, 0x73, 0x00]
skip_original_bytes = false
exclude_from_restore = []

[[hooks.parameters]]
source = "ecx"
type = "pointer"

# Bypass Control's own Vector::Normalize, but only while the stick is driving.
# That call is correct for the keyboard, where each axis is exactly +/-1 and an
# unnormalised diagonal would be sqrt(2) too fast. It is wrong for analog: it
# would rescale a half-deflected diagonal back to full speed. The handler
# returns zero for keyboard and mouse, so vanilla behaviour is untouched.
#
# Verified safe to skip: Vector::Normalize is __thiscall taking only the vector,
# touches no globals, balances its own stack, and its return value is dead --
# 0x00679B76 overwrites eax immediately. The x87 stack is empty at the call site.
[[hooks]]
address = 0x00679B71
type = "detour"
function = "NativeJoystickSkipNormalizeK1"
original_bytes = [0xE8, 0xBA, 0x15, 0xE3, 0xFF]
skip_original_bytes = true
consumed_exit_address = 0x00679B76
exclude_from_restore = ["eax"]

[[hooks.parameters]]
source = "ecx"
type = "pointer"

# The GUI's own per-frame update, where KMRP's focus navigation performs its
# moves. It has to be here rather than in the input hook: CSWGuiPanel::
# SetActiveControl changes focus, plays a sound and lets controls redraw, and
# calling that from inside CExoInput's polling would re-enter the engine at a
# point it never does so itself. This hook also runs in menus, which the
# gameplay movement heartbeat does not.
#
# The stolen bytes are push ecx / push ebx / push ebp / push esi / mov ebp, ecx
# -- six bytes, all position-independent, so the trampoline can re-execute them
# safely. See tools/check_hook_stolen_bytes.py.
[[hooks]]
address = 0x0040CE70
type = "detour"
function = "NativeGuiFrameK1"
original_bytes = [0x51, 0x53, 0x55, 0x56, 0x8B, 0xE9]
skip_original_bytes = false
exclude_from_restore = []

[[hooks.parameters]]
source = "ecx"
type = "pointer"

# Apply the right-stick camera turn, immediately after UpdateCamera has run.
#
# The timing is the whole point, and getting it wrong is why an earlier version
# called CSWCModule::RotateCamera 1400 times in 30 seconds without the view
# moving once. RotateCamera stores the turn in camera+0x10C. UpdateCamera's idle
# path -- the one taken whenever the keyboard turn axis is zero, which is always
# for a controller -- calls CSWCModule::ScrollCamera at 0x005F60D5, and
# ScrollCamera zeroes camera+0x10C outright at 0x0063FE87. Anything written
# before that point in the frame is erased. The keyboard escapes it because a
# non-zero turn makes UpdateCamera jump past the ScrollCamera call at
# 0x005F6024.
#
# 0x006039CF is where both of UpdateCamera's paths converge, still inside the
# same function, with ESI holding CClientExoAppInternal. The stolen bytes are
# mov eax,[0x7a39e0] / mov ecx,[eax+4] -- eight bytes, absolute addressing only,
# no relative branches to relocate. See tools/check_hook_stolen_bytes.py.
[[hooks]]
address = 0x006039CF
type = "detour"
function = "NativeCameraFrameK1"
original_bytes = [0xA1, 0xE0, 0x39, 0x7A, 0x00, 0x8B, 0x48, 0x04]
skip_original_bytes = false
exclude_from_restore = []

[[hooks.parameters]]
source = "esi"
type = "pointer"

# Skip a pre-rendered movie with the controller.
#
# Movies own the game loop: while one plays, CExoInput is not polled and no
# retained event can be delivered, so there is nothing to register and this has
# to be a bridge. The site is inside CExoMoviePlayerInternal::PlayMovieLoop --
# the loop body at 0x00404D96, not the prologue, which runs once before the
# first frame. ESI holds the player; ECX is scratch by this point.
#
# The stolen bytes cover two whole instructions, so the re-executed prologue
# leaves EAX and ECX exactly as the following cmp/jne expects.
#
# Saul0097's build hooks this same address with PollMovieControllerK1. Both
# cannot be installed at once, so select_controller_path.py drops the legacy
# entry when this one is present.
[[hooks]]
address = 0x00404D96
type = "detour"
function = "NativeMovieFrameK1"
original_bytes = [0x8B, 0x46, 0x48, 0x8B, 0x48, 0x08]
skip_original_bytes = false
exclude_from_restore = []

[[hooks.parameters]]
source = "esi"
type = "pointer"

# Drive the gameplay HUD's bottom-right action bar from the D-pad.
#
# CSWGuiMainInterface's per-frame update, ecx = the interface. The engine calls
# this reaches -- MoveFocus, CycleAction and the activate callback, all of them
# CSWGuiMainInterface's own -- expect to run during GUI work rather than inside
# CExoInput's polling, which is why the site is here and not in the input hook.
#
# Saul0097's build hooks this same address with UpdateActionBarControlsK1, which
# does the same work from synthesised arrow keys. Both cannot be installed at
# once, so select_controller_path.py drops the legacy entry when this is present.
[[hooks]]
address = 0x00686BA0
type = "detour"
function = "NativeActionBarK1"
original_bytes = [0x53, 0x56, 0x57, 0x8B, 0xF1]
skip_original_bytes = false
exclude_from_restore = []

[[hooks.parameters]]
source = "ecx"
type = "pointer"


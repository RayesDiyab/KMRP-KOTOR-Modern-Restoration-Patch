type = "pointer"

# ---------------------------------------------------------------------------
# Rumble and haptics: the mixer in K1Rumble.cpp. See docs/controller-rumble.md.
#
# One hook declines, the rest observe. Every pattern the engine starts -- a
# script's PlayRumblePattern, a footstep, a VFX -- is handed to the mixer and the
# engine's own queue is skipped, so one mixer owns both motors: BioWare's rows,
# the two restored ones, and KMRP's Enhanced patterns, combined per motor by
# maximum. The observers supply the events BioWare never wired to rumble.

# CClientExoAppInternal::PlayRumblePattern, 0x005FB490, at its index test:
#   005FB491  mov ebp,[esp+8]        the pattern index
#   005FB499  jl 0x5FB536            negative: return 0
#   005FB49F  cmp ebp,[ecx+0x344]    <- here; the stolen bytes
#   005FB4A5  jge 0x5FB536           past the count: return 0
#   005FB536  pop edi / pop esi / xor eax,eax / pop ebp / ret 4
# The handler returns 1 and KPM takes the consumed exit to 0x005FB536, the
# function's own `return 0` with its own three pops. The stolen `cmp` writes
# neither EAX nor ESP, and KPM preserves the flags across its EAX test, so a
# return of 0 falls into the `jge` exactly as vanilla. `return 0` is also what
# the shipped PC game returned for every call, its pattern count being zero.
[[hooks]]

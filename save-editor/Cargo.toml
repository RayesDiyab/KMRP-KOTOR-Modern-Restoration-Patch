[package]
name = "kmrp-save-editor"
version = "1.0.0"
edition = "2021"
description = "KMRP Save Editor: opens KotOR 1 and KotOR 2 saves and changes them safely"
authors = ["RaymanGT"]
license = "GPL-3.0-or-later"
publish = false

[[bin]]
name = "kmrp-save-editor"
path = "src/main.rs"

[lib]
name = "kse_core"
path = "src/lib.rs"

[dependencies]
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "unstable-winit-030"] }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[build-dependencies]
slint-build = "1.18"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

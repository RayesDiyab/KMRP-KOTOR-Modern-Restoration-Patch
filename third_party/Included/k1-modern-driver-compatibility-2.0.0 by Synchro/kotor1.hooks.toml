# `ConvertHeightFieldAndLoadNormalMapTexture` uploads a normal map as `GL_BGRA`, Z in byte 0,
# which is how it converts a height map and how `downSampleNormalMap` builds the mips. A
# 32-bit `isbumpmap 2` TGA skips the conversion and is copied, and the TGA loader has already
# swapped every texel's first and third byte to make RGB, so each normal uploaded with X and
# Z exchanged. A TPC never comes here. The handler swaps them back in the copy, before the
# upload and the mips read it. EBX holds the copy and EAX its length in bytes; the cut runs
# after, copying the bytes past the last whole dword, of which four bytes a texel leave none.
#   004260CF  F3 A5            rep movsd
#   004260D1  8B C8            mov  ecx, eax
#   004260D3  83 C4 04         add  esp, 4
#   004260D6  83 E1 03         and  ecx, 3
#   004260D9  F3 A4            rep movsb               <- cut
#   004260DB  8B 7C 24 1C      mov  edi, [esp + 0x1c]  <- cut
#   004260DF  EB 24            jmp  0x00426105
[[hooks]]
address = 0x004260D9
type = "detour"
function = "ARB_ReorderNormalMap"
original_bytes = [0xF3, 0xA4, 0x8B, 0x7C, 0x24, 0x1C]
skip_original_bytes = false
exclude_from_restore = []

[[hooks.parameters]]
source = "ebx"
type = "pointer"

[[hooks.parameters]]
source = "eax"
type = "uint"

# `BloomFilter` at 0x0042B810, the blur both the glow and the soft shadows run through, calls
# `glActiveTextureARB` before each `glMultiTexCoord2fARB` inside its `glBegin`/`glEnd` strip.
# GL does not allow that call there, so each raises `GL_INVALID_OPERATION` and is ignored. The
# `glMultiTexCoord2fARB` beside it names its own unit, so the coordinates already land where
# they should, and the game selects unit 0 again after `glEnd`. These remove the calls so the
# blur stops raising an error every frame, and an error the patch reports raised before its
# passes means something new. The push stays, because three of the sites store relative to
# ESP after it, and `add esp, 4` pops it as the stdcall callee did. The instruction after each
# site is `test esi, esi`, which sets the flags again. The game's other `BloomFilter`, at
# 0x0042BF80, makes the same calls, and only the paths this patch turns the game away from
# reach it.
#   0042BC1C  68 C0 84 00 00      push 0x84C0
#   0042BC21  FF 15 0C B8 7B 00   call [glActiveTextureARB]   -> add esp, 4 and pad
#   0042BC27  85 F6               test esi, esi
[[hooks]]
address = 0x0042BC21
type = "simple"
original_bytes = [0xFF, 0x15, 0x0C, 0xB8, 0x7B, 0x00]
replacement_bytes = [0x83, 0xC4, 0x04, 0x90, 0x90, 0x90]

#   0042BCAC  68 C1 84 00 00      push 0x84C1
#   0042BCB1  89 4C 24 20         mov  [esp + 0x20], ecx
#   0042BCB5  FF 15 0C B8 7B 00   call [glActiveTextureARB]   -> add esp, 4 and pad
[[hooks]]
address = 0x0042BCB5
type = "simple"
original_bytes = [0xFF, 0x15, 0x0C, 0xB8, 0x7B, 0x00]
replacement_bytes = [0x83, 0xC4, 0x04, 0x90, 0x90, 0x90]

#   0042BD36  68 C2 84 00 00      push 0x84C2
#   0042BD3B  89 44 24 20         mov  [esp + 0x20], eax
#   0042BD3F  FF 15 0C B8 7B 00   call [glActiveTextureARB]   -> add esp, 4 and pad
[[hooks]]
address = 0x0042BD3F
type = "simple"
original_bytes = [0xFF, 0x15, 0x0C, 0xB8, 0x7B, 0x00]
replacement_bytes = [0x83, 0xC4, 0x04, 0x90, 0x90, 0x90]

#   0042BDC7  68 C3 84 00 00      push 0x84C3
#   0042BDCC  89 54 24 20         mov  [esp + 0x20], edx
#   0042BDD0  FF 15 0C B8 7B 00   call [glActiveTextureARB]   -> add esp, 4 and pad
[[hooks]]
address = 0x0042BDD0
type = "simple"
original_bytes = [0xFF, 0x15, 0x0C, 0xB8, 0x7B, 0x00]
replacement_bytes = [0x83, 0xC4, 0x04, 0x90, 0x90, 0x90]

#   0042BE35  68 C0 84 00 00      push 0x84C0
#   0042BE3A  FF 15 0C B8 7B 00   call [glActiveTextureARB]   -> add esp, 4 and pad
[[hooks]]
address = 0x0042BE3A
type = "simple"
original_bytes = [0xFF, 0x15, 0x0C, 0xB8, 0x7B, 0x00]
replacement_bytes = [0x83, 0xC4, 0x04, 0x90, 0x90, 0x90]

# `InitAttenuationTexture` sets the attenuation texture's `GL_TEXTURE_MAX_ANISOTROPY_EXT` from
# the anisotropy global, once before its upload and once after. `InitExtensions` builds the
# texture before the options are applied, so the global still holds its initial 0, and the
# extension refuses anything under 1.0 with `GL_INVALID_VALUE`. The texture keeps the default
# of 1.0 either way, and every later bind through `AurTextureBindTID` or `BindTexture` sets the
# value again from the global, which by then holds the player's setting. These remove both
# calls with their pushes, so the stack is left as the call left it.
#   004264A2  50                  push eax                 (anisotropy)
#   004264A3  68 FE 84 00 00      push 0x84FE              -> nops
#   004264A8  51                  push ecx                 (GL_TEXTURE_2D)
#   004264A9  FF D6               call esi                 (glTexParameteri)
[[hooks]]
address = 0x004264A2

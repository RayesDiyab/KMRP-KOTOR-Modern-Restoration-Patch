# The lightmapped bump renderers build their vertex programs from NVIDIA-only `!!VP1.0`
# text. The game appends ARB light code to every lit program and compiles it through
# `glProgramStringARB`, which no driver accepts for that text, so those surfaces drew
# nothing. Each hook sits on the store of the program its renderer has just built, before
# the renderer first enables it, and the handler points the program at our ARB translation.
# The store runs afterwards, unchanged; it addresses its global absolutely, so it runs the
# same from the wrapper. The constant says which renderer's program EAX holds, as
# `k1_sys::vertex::RendererProgram` numbers them.

# RenderLightMappedBumpDiffuse, after `VertexProgram::VertexProgram` returns.
#   00474FC1  E8 0A D8 02 00   call VertexProgram::VertexProgram
#   00474FC6  EB 02            jmp  0x00474FCA
#   00474FC8  33 C0            xor  eax, eax          (the allocation failed)
#   00474FCA  A3 A8 01 83 00   mov  [renderLightMappedBumpDiffuseBumpMapVP], eax   <- hooked
[[hooks]]
address = 0x00474FCA
type = "detour"
function = "ARB_AdoptVertexProgram"
original_bytes = [0xA3, 0xA8, 0x01, 0x83, 0x00]
skip_original_bytes = false
exclude_from_restore = []

[[hooks.parameters]]
source = "eax"
type = "pointer"

[[hooks.parameters]]
source = "const:0"
type = "uint"


# `Material::HasNormalMap` returns false in every build of both games. It gates object-space
# normal mapping, for a material whose bump map is a normal map (`isbumpmap 2`, 32 bits a
# texel): tangent space is left unbuilt, and `GetRenderPath` sends a bump mapped mesh without
# tangents to `RenderNormalMapped`, path 15. Here its three calls land on `0x0041F250`, a
# `xor al, al; ret` the linker shares with every virtual that returns false, so the calls are
# replaced and that body is left alone. Each call loads the material into ECX, which the
# handler reads, and the game tests AL afterwards, so EAX carries the answer back.

# MdlNodeTriMesh::InternalPostProcess, deciding whether to build tangent space.
#   0043D0F0  8B CD            mov  ecx, ebp
#   0043D0F2  E8 59 21 FE FF   call 0x0041F250        <- replaced

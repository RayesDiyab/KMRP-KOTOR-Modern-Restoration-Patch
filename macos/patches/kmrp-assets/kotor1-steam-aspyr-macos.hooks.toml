# The sizes the game's Screen Resolution list accepts (resolution.cpp): the game's whitelist
# routine, at its entry. The stolen bytes are its prologue and its first comparison, cmp esi, 800,
# which run again when the handler does not accept the size; an accepted size leaves through the
# routine's own `pop rbp; ret` with the handler's 1.
#   0x10026f1ee  push rbp; mov rbp, rsp; cmp esi, 0x320
#   0x10026f1f8  mov eax, 1; jnz ...
#   0x10026f246  pop rbp; ret
[[hooks]]
address = 0x10026f1ee
type = "detour"
function = "KmrpResolutionKnown"
original_bytes = [0x55, 0x48, 0x89, 0xe5, 0x81, 0xfe, 0x20, 0x03, 0x00, 0x00]
consumed_exit_address = 0x10026f246

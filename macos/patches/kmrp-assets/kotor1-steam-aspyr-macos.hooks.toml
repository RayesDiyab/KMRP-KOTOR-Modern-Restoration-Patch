# KMRP's menu sets and artwork, from the module (assets.cpp).
#
# The client's start-up (0x10026c3f0) registers the game's resource directories one after
# another; this is its call to CExoResMan::AddResourceDirectory (0x1003693bc) for "OVERRIDE:".
# The handler makes that call and then registers KMRP's cache, which is then searched before the
# override folder: a new key table goes to the head of the manager's list.
#   0x10026c732  lea rsi, [rbp-0x40]     the name
#   0x10026c736  mov rdi, rbx            the manager
#   0x10026c739  call 0x1003693bc        <- here; a relative call, which cannot run from the
#                                           wrapper, so the handler always consumes
#   0x10026c73e  lea rdi, [rbp-0x40]     the game does not read the call's result
[[hooks]]
address = 0x10026c739
type = "detour"
function = "KmrpAddOverrideDirectory"
original_bytes = [0xe8, 0x7e, 0xcc, 0x0f, 0x00]
skip_original_bytes = true
consumed_exit_address = 0x10026c73e
exclude_from_restore = ["eax"]
[[hooks.parameters]]
source = "rdi"
type = "pointer"
[[hooks.parameters]]
source = "rsi"
type = "pointer"

# The resolution changed in the game (resolution.cpp).
#
# The game's mode switch (0x10026ef34), at its call to Global::ReInitAurora (0x1004ac827), after
# it has stored the new size and before the renderer is re-initialised and the menus are loaded
# again. A relative call, so the handler makes it and always consumes; the routine does not read
# its result.
#   0x10026f0ec  call 0x1004ac827     edi width, esi height, edx depth, ecx windowed, r8d 1
#   0x10026f0f1  mov [r12+0x274], r14d
[[hooks]]
address = 0x10026f0ec
type = "detour"
function = "KmrpModeSwitch"
original_bytes = [0xe8, 0x36, 0xd7, 0x23, 0x00]
skip_original_bytes = true
consumed_exit_address = 0x10026f0f1
exclude_from_restore = ["eax"]
[[hooks.parameters]]
source = "rdi"
type = "int"
[[hooks.parameters]]
source = "rsi"
type = "int"
[[hooks.parameters]]
source = "rdx"
type = "int"
[[hooks.parameters]]
source = "rcx"
type = "int"
[[hooks.parameters]]
source = "r8"
type = "int"


# CSWGuiPanel::StopLoadFromLayout (0x10049d986), after its prologue: every panel constructor's
# last call, where layout.cpp widens the lists its table says to. The entry itself is the
# controller's (kmrp-controller, KmrpPanelReleaseGff, whose 6 stolen bytes end here); these 7 are
# the next two instructions, nothing in them relative, and rdi is still the panel.
#   0x10049d98c  mov rbx, rdi; test byte [rbx+0x5c], 2
#   0x10049d993  jnz ...
[[hooks]]

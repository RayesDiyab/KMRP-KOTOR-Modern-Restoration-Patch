[metadata]
target_versions = ["C1FCB8D37C702849882A17751C63EE0AF7C2B9CBBC3B31B98A5F0EDBC27C6D71"]

# KMRP map-note corrections (Derslok's K1 Area Map Fixes table, see map_notes.cpp).
#
# CSWGuiMapHider::Draw, note loop: rbx = the note's object, whose world position the
# next lines read ([rbx+0xd8] x/y, [rbx+0xe0] z) for the world->map conversion. The
# detour corrects x/y in place before that read.
#   0x1002b4f52  cmp dword ptr [rbx + 0x2f4], 0   (map-note flag; 7 bytes, no RIP-relative
#                operand, and the je after it reads flags set by this cmp, which the
#                wrapper re-executes after the call)
[[hooks]]
address = 0x1002b4f52
type = "detour"
function = "KMRP_CorrectMapNotePosition"
original_bytes = [0x83, 0xBB, 0xF4, 0x02, 0x00, 0x00, 0x00]
[[hooks.parameters]]
source = "rbx"
type = "pointer"

# K1 Marked Empty Containers (marked_empty.cpp): UpdateNameLabel's call to SetNameLabel. A relative
# call, so the handler makes it and always consumes; the routine does not read its result.
#   0x100230e8e  call 0x1002309c6     rdi the menu, rsi the name
#   0x100230e93  mov dword ptr [r15 + 0x1d1c], 0x3f800000
[[hooks]]
address = 0x100230e8e
type = "detour"
function = "KmrpHoverName"
original_bytes = [0xe8, 0x33, 0xfb, 0xff, 0xff]
skip_original_bytes = true
consumed_exit_address = 0x100230e93
exclude_from_restore = ["eax"]
[[hooks.parameters]]
source = "rdi"
type = "pointer"
[[hooks.parameters]]
source = "rsi"
type = "pointer"

# The hovered object, as UpdateNameLabel starts (marked_empty.cpp says why it is taken here).
#   0x100230cc1  mov rbx, rsi
#   0x100230cc4  mov r15, rdi
[[hooks]]
address = 0x100230cc1
type = "detour"
function = "KmrpHoverObject"
original_bytes = [0x48, 0x89, 0xf3, 0x49, 0x89, 0xff]
[[hooks.parameters]]
source = "rsi"
type = "pointer"

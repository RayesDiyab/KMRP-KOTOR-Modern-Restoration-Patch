# ------------------------------------------------------------------------- turning with the mouse
# The mouse's movement of a frame, already in proportion to the frame's length, was multiplied
# by the frame's length again, so a turn was slower the higher the frame rate. The step is a
# fixed sixtieth of a second instead. Windows divides by a global (0x0078E564) taken here to be
# 60, as for the scrolling textures above: not read from the Windows game.
# CSWCameraFreeLook::Control (0x1002b2908). Windows 0x00639E01.
#   1002b2a63  movss xmm2, [rbp-0x1c]   ->   mov eax, 1/60 ; movd xmm2, eax
[[hooks]]

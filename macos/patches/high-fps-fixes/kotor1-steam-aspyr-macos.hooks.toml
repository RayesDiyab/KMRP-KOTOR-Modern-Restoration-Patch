# it ages the trail's samples, which die at 0.012 s. Windows 0x00481AF8 (jz made a jump).
#   1001aeacd  maxss xmm2, [rbp-0x38]   ->   movss xmm2, [rbp-0x38]
[[hooks]]
address = 0x1001aeacd
type = "simple"
original_bytes = [0xf3, 0x0f, 0x5f, 0x55, 0xc8]

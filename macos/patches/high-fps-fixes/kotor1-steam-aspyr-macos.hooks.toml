# High FPS Fixes for the Steam Aspyr macOS build of KOTOR 1: the hook list.
# A port of D3M0's High FPS Fixes 1.0.1 (MIT); each block names the Windows site it stands for
# (HighFpsFixes/src/kotor1.hooks.toml of https://github.com/gnw-d3m0/D3M0s-KPatches). The
# handlers are in high_fps_fixes.cpp. Parameters are plain registers only: released KotOR Patch
# Manager 0.7.1 takes no register+offset source, so a handler given rbp applies the offset.
#
# make_high_fps_patch.py holds every original_bytes against the unmodified game.

# ---------------------------------------------------------------- the 60 Hz gate for jitter
# CClientExoAppInternal::MainLoop (0x1002677d4): eax = microseconds elapsed on the frame timer.
# Windows 0x0060335D, K1UpdateJitterTick.
#   100267cfe  xorps xmm0, xmm0 ; cvtsi2ss xmm0, eax
[[hooks]]
address = 0x100267cfe
type = "detour"
function = "HfpsUpdateJitterTick"
original_bytes = [0x0f, 0x57, 0xc0, 0xf3, 0x0f, 0x2a, 0xc0]
[[hooks.parameters]]
source = "eax"
type = "int"

# Global::ProceduralAnimateHierarchy (0x1001ae5a7): r15 = mesh node, rbp = frame. The Mac has
# one uv loop where Windows has three. Windows 0x004836C7, 0x00483916, 0x00483B72.
#   1001ae676  xor r14d, r14d ; movaps [rbp-0x50], xmm2
[[hooks]]
address = 0x1001ae676
type = "detour"
function = "HfpsGateUvJitter"
original_bytes = [0x45, 0x31, 0xf6, 0x0f, 0x29, 0x55, 0xb0]
[[hooks.parameters]]
source = "r15"
type = "pointer"
[[hooks.parameters]]
source = "rbp"
type = "pointer"

# The same loop: the texture's drift a frame becomes its drift a sixtieth of a second times the
# frame's length (uvdir * dt * 60). Windows 0x004836E6, 0x00483703, 0x00483936, 0x00483950,
# 0x00483BA4, 0x00483BB3, which multiply by the frame's seconds and by a global taken here to
# be 60 (not read from the Windows game: every other reference rate of the patch is 60).
# Raw code, no handler: this runs once a vertex. It touches rax, xmm0 and xmm1, all dead here,
# and no flag, so the jump that follows still reads the compare before it.
#   movabs rax, 0x1005ca818 ; movss xmm1, [rax] ; mov eax, 60.0f ; movd xmm0, eax ; mulss xmm1, xmm0
#   movss xmm0, [r15+0x17c] ; mulss xmm0, xmm1 ; addss xmm0, [r12+8*r14]   ; movss [r12+8*r14], xmm0
#   movss xmm0, [r15+0x180] ; mulss xmm0, xmm1 ; addss xmm0, [r12+8*r14+4] ; movss [r12+8*r14+4], xmm0
[[hooks]]
address = 0x1001ae688
type = "replace"
original_bytes = [
    0xf3, 0x41, 0x0f, 0x10, 0x87, 0x7c, 0x01, 0x00, 0x00, 0xf3, 0x43, 0x0f, 0x58, 0x04, 0xf4,
    0xf3, 0x43, 0x0f, 0x11, 0x04, 0xf4, 0xf3, 0x41, 0x0f, 0x10, 0x87, 0x80, 0x01, 0x00, 0x00,
    0xf3, 0x43, 0x0f, 0x58, 0x44, 0xf4, 0x04, 0xf3, 0x43, 0x0f, 0x11, 0x44, 0xf4, 0x04,
]
replacement_bytes = [
    0x48, 0xb8, 0x18, 0xa8, 0x5c, 0x00, 0x01, 0x00, 0x00, 0x00,
    0xf3, 0x0f, 0x10, 0x08,
    0xb8, 0x00, 0x00, 0x70, 0x42,
    0x66, 0x0f, 0x6e, 0xc0,
    0xf3, 0x0f, 0x59, 0xc8,
    0xf3, 0x41, 0x0f, 0x10, 0x87, 0x7c, 0x01, 0x00, 0x00,
    0xf3, 0x0f, 0x59, 0xc1,
    0xf3, 0x43, 0x0f, 0x58, 0x04, 0xf4,
    0xf3, 0x43, 0x0f, 0x11, 0x04, 0xf4,
    0xf3, 0x41, 0x0f, 0x10, 0x87, 0x80, 0x01, 0x00, 0x00,
    0xf3, 0x0f, 0x59, 0xc1,
    0xf3, 0x43, 0x0f, 0x58, 0x44, 0xf4, 0x04,
    0xf3, 0x43, 0x0f, 0x11, 0x44, 0xf4, 0x04,
]

# ------------------------------------------------------------ lightsaber trails, dangly meshes

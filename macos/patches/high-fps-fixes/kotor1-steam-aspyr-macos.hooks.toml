type = "replace"
original_bytes = [0xf3, 0x0f, 0x10, 0x55, 0xe4]
replacement_bytes = [0xb8, 0x89, 0x88, 0x88, 0x3c, 0x66, 0x0f, 0x6e, 0xd0]


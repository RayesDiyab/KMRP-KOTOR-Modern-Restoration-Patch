# KMRP controller support (native.cpp).
#
# CExoInputInternal::GetEvents, entry: once per input poll, before the engine polls its
# devices. KmrpControllerTick registers the pad's button descriptions, keeps a pad in the
# device count and reads the pad. rsi is the CExoInputInternal (rdi is the returned list).
# The stolen bytes are the prologue's pushes, nothing position-dependent.
#   0x100356276  push rbp; mov rbp,rsp; push r15; push r14; push r13; push r12; push rbx
#
# GetJoystickBuffer (0x100358cdc) is replaced by the module's constructor, not here: the
# whole function is swapped, with a jump over its prologue, checked before it is written.
[[hooks]]
address = 0x100356276
type = "detour"
function = "KmrpControllerTick"
original_bytes = [0x55, 0x48, 0x89, 0xe5, 0x41, 0x57, 0x41, 0x56, 0x41, 0x55, 0x41, 0x54, 0x53]
[[hooks.parameters]]
source = "rsi"
type = "pointer"

# Aspyr's own pad mapping, switched off. The Mac port ends GetEvents with a translation
# Windows does not have: a scan of the first pad's records (0x100356e39..0x100356fc5) that
# reads them as an Xbox 360 DirectInput pad, then an injection (0x100356fee..0x1003570f4) of
# a second event per press, by input class (column table at 0x100572110). It never ran before KMRP, because Aspyr's own pad layer never finds a pad;
# with KMRP's records it would double every binding, and where the layouts disagree act on
# its own: KMRP's Start is button 8, which Aspyr reads as L3 and turns into 0xF2, Flourish
# (seen 2026-09-29: a Start press in the world opened the menu and queued a flourish).
# KMRP's descriptions are the whole mapping, as on Windows, so the injection is skipped: the
# class check before it, `cmp r13d, 5; ja <end>`, becomes an unconditional jump to <end>.
#   0x100356ff2  ja  0x1003570fa   ->   jmp 0x1003570fa; nop
[[hooks]]
address = 0x100356ff2
type = "simple"
original_bytes = [0x0f, 0x87, 0x02, 0x01, 0x00, 0x00]
replacement_bytes = [0xe9, 0x03, 0x01, 0x00, 0x00, 0x90]

# The world (gameplay.cpp), K1NativeJoystick.cpp's gameplay hooks.
#
# CSWPlayerControlCamRelative::Control, entry (Windows 0x00679940): the movement heartbeat,
# which decides once a frame whether the left stick drives the character. rdi is the player
# control. The stolen bytes are the prologue's pushes.
[[hooks]]
address = 0x1002249b2
type = "detour"
function = "KmrpMovementFrame"
original_bytes = [0x55, 0x48, 0x89, 0xe5, 0x41, 0x57, 0x41, 0x56]
[[hooks.parameters]]
source = "rdi"
type = "pointer"

# Control's call to Vector::Normalize (Windows 0x00679B71), skipped while the stick drives so
# the speed follows the deflection. The stolen bytes are a relative call, which cannot run
# from the wrapper, so the handler always consumes and makes the call itself when it should
# happen; eax (the spelling the validator asks for) is left to it, as the consumed-exit test reads it.
[[hooks]]
address = 0x100224c56
type = "detour"
function = "KmrpSkipNormalize"
original_bytes = [0xe8, 0x33, 0xa7, 0x14, 0x00]
skip_original_bytes = true
consumed_exit_address = 0x100224c5b
exclude_from_restore = ["eax"]
[[hooks.parameters]]
source = "rdi"
type = "pointer"

# MainLoop's call to UpdateCamera (Windows: MainLoop after UpdateCamera, 0x006039CF), made in
# play and in free look only. The handler makes the call, adds the right stick's turn, and
# runs the world's bridges (L3's flourish, Start's Map, A on the target, R3 out of free look).
# A relative call again, so it always consumes. rdi is CClientExoAppInternal.
[[hooks]]
address = 0x100268424
type = "detour"
function = "KmrpCameraFrame"
original_bytes = [0xe8, 0x87, 0x11, 0x00, 0x00]
skip_original_bytes = true
consumed_exit_address = 0x100268429
exclude_from_restore = ["eax"]
[[hooks.parameters]]
source = "rdi"
type = "pointer"


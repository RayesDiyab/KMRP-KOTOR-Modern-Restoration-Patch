# Rumble (rumble.cpp), K1Rumble.cpp's hooks. See docs/controller-rumble.md.
#
# Aspyr kept the rumble subsystem and stubbed its output: CExoInput::SetRumble, PauseRumble and
# UnpauseRumble do nothing (0x10035738C, 0x10035739C, 0x1003573A2). One mixer owns both motors:
# every pattern the engine starts is handed to it, and the observers supply the events BioWare
# never wired to rumble.
#
# MainLoop's call to UpdateRumble (Windows: SetRumble's call in UpdateRumble, 0x005F7617),
# replaced: the mixer's frame, with the frame time MainLoop passes (0x1005CA818, as for the
# camera), and the pad's motors. A relative call, so it always consumes. r13 is the internal.
[[hooks]]
address = 0x1002687f1
type = "detour"
function = "KmrpRumbleFrame"
original_bytes = [0xe8, 0x00, 0x27, 0x00, 0x00]
skip_original_bytes = true
consumed_exit_address = 0x1002687f6
exclude_from_restore = ["eax"]
[[hooks.parameters]]
source = "r13"
type = "pointer"

# CClientExoAppInternal::PlayRumblePattern (0x10027A0FC; Windows 0x005FB49F), after its prologue:
#   10027a106  mov ebx, esi / xor eax, eax / test ebx, ebx   <- here; the stolen bytes
#   10027a185  add rsp, 8 / pop rbx / pop r14 / pop r15 / pop rbp / ret
# The handler plays the index and returns 1, and the consumed exit is the function's own
# epilogue, which returns that 1 (Windows' returns 0; only the script command reads it).
[[hooks]]
address = 0x10027a106
type = "detour"
function = "KmrpRumblePlay"
original_bytes = [0x89, 0xf3, 0x31, 0xc0, 0x85, 0xdb]
skip_original_bytes = false
consumed_exit_address = 0x10027a185
exclude_from_restore = ["eax"]
[[hooks.parameters]]
source = "rdi"
type = "pointer"
[[hooks.parameters]]
source = "esi"
type = "int"


# Movies (gameplay.cpp), K1NativeJoystick.cpp's NativeMovieFrameK1.
#
# Aspyr's movie loop (0x1000139e4), at the top of each frame: `cmp byte ptr [rbp-0x4af], 0`,
# the test of the loop's "cancelled" byte, seven position-independent bytes, re-run after the
# handler so the jne that follows reads fresh flags. The handler gets the loop's state block,
# rbp-0x4b0, whose byte 0 a key's release sets to skip the movie; A and Start set it too.
[[hooks]]
address = 0x100014566
type = "detour"
function = "KmrpMovieFrame"
original_bytes = [0x80, 0xbd, 0x51, 0xfb, 0xff, 0xff, 0x00]
[[hooks.parameters]]
source = "rbp-0x4b0"
type = "pointer"

# Which device the player is on (prompts.cpp), K1NativeJoystick.cpp's NativeNoteKeyboardK1: a
# key pressed hides the button prompts and gives the cursor back. (Windows' NativeNoteMouseK1, at
# CSWGuiManager::HandleMouseMove, has no hook here: the Mac calls HandleMouseMove only while its
# own cursor is shown, so prompts.cpp reads the pointer the frame loop samples instead.)
#
# GetEvents' call to read the keyboard's buffered records (0x10035984C), made while no text box
# has the keyboard. The handler makes the read and then looks at its records, where Windows reads
# each record in the loop that follows. A relative call again, so it always consumes; GetEvents
# does not use its result. rdi is the raw input, rsi the {records, count} buffer.
[[hooks]]
address = 0x1003563f3
type = "detour"
function = "KmrpNoteKeyboard"
original_bytes = [0xe8, 0x54, 0x34, 0x00, 0x00]
skip_original_bytes = true
consumed_exit_address = 0x1003563f8
exclude_from_restore = ["eax"]
[[hooks.parameters]]
source = "rdi"
type = "pointer"
[[hooks.parameters]]
source = "rsi"
type = "pointer"


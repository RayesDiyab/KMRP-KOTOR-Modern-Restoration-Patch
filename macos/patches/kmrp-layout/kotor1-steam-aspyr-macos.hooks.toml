# Resolution-dependent sites are still applied by the module constructor.
# CSWGuiControl::Load entry: restore MOVETO IDs before the panel resolves them.
# Stolen instructions: push rbp; mov rbp,rsp; push r15 (no relative operands).
[[hooks]]
address = 0x1004a4b78
type = "detour"
function = "KmrpLoadNavigation"
original_bytes = [0x55, 0x48, 0x89, 0xe5, 0x41, 0x57]
[[hooks.parameters]]
source = "rdi"
type = "pointer"
[[hooks.parameters]]
source = "rsi"
type = "pointer"
[[hooks.parameters]]
source = "rdx"
type = "pointer"

# Observe native keyboard arrow events before CSWGuiNavigable handles them.
[[hooks]]

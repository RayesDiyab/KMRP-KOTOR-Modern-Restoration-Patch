# Mac memory safety: see reverse-engineering/macos-memory-safety-audit.md.

# Texture bucket insertion: unsigned IDs >=5000 skip insertion to native shadow continuation.
# Target is non-PIE; push/mov/xchg/ret preserves RAX and balances RSP.

# HandleMouseMove: consume unchanged-coordinate samples after an arrow.
# The wrapper replays push rbp/mov rbp,rsp/push r15 before testing EAX.
# Exit through pop r15/pop rbp/ret to undo exactly those stolen instructions.
[[hooks]]
address = 0x1004a035e
type = "detour"
function = "KmrpKeepKeyboardFocus"
original_bytes = [0x55, 0x48, 0x89, 0xe5, 0x41, 0x57]
consumed_exit_address = 0x1004a077b
exclude_from_restore = ["eax"]
[[hooks.parameters]]
source = "rdi"
type = "pointer"
[[hooks.parameters]]
source = "rsi"
type = "int"
[[hooks.parameters]]
source = "rdx"
type = "int"

